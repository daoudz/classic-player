# ---------------------------------------------------------------------------
#  Classic Player - engine configuration
#  The UI itself is drawn by scripts/classicplayer/main.lua.
# ---------------------------------------------------------------------------

# --- Window -----------------------------------------------------------------
title=${?media-title:${media-title} - }Classic Player
border=no                      # classic window frame is drawn by the UI script
geometry=720x560
auto-window-resize=no          # keep the window size stable like classic apps
keepaspect-window=no
snap-window=yes
idle=yes
force-window=yes
keep-open=yes
window-dragging=no             # dragging is done via the classic title bar
cursor-autohide=1000
cursor-autohide-fs-only=yes
background-color='#000000'

# --- Built-in UI off (replaced by Classic Player UI) ------------------------
osc=no
osd-bar=no
osd-on-seek=no
osd-level=1
osd-font-size=26
load-stats-overlay=no
load-console=yes               # needed for the "Open URL" text prompt
load-select=no
load-commands=no
load-positioning=no
load-context-menu=no

# --- Low resource usage -----------------------------------------------------
hwdec=auto-safe                # hardware decoding where available
profile=fast                   # cheap scaling, low GPU usage
demuxer-max-bytes=48MiB
demuxer-max-back-bytes=16MiB
audio-display=embedded-first   # show album art for music if present

# --- Subtitles --------------------------------------------------------------
sub-auto=fuzzy                 # auto-load subtitles with similar names
sub-use-margins=no             # keep subtitles inside the video area
sub-font-size=40
sub-border-size=2.5

# --- Screenshots ------------------------------------------------------------
screenshot-format=png
screenshot-png-compression=6
screenshot-directory=~~/screenshots
screenshot-template=ClassicPlayer-%F-%tY%tm%td-%tH%tM%tS

# --- Misc -------------------------------------------------------------------
volume=80
volume-max=150
save-position-on-quit=no
input-default-bindings=yes

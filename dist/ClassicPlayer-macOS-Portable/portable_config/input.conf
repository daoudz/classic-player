# ---------------------------------------------------------------------------
# Classic Player - Key and Mouse Bindings
# (Many interactions are also handled directly by the Lua UI script)
# ---------------------------------------------------------------------------

# Playback controls
SPACE       cycle pause
p           cycle pause
STOP        script-binding classicplayer/stop

# Seeking
LEFT        seek -10
RIGHT       seek 10
Shift+LEFT  seek -30
Shift+RIGHT seek 30
Ctrl+LEFT   seek -60
Ctrl+RIGHT  seek 60
[           multiply speed 1/1.1
]           multiply speed 1.1
{           multiply speed 0.5
}           multiply speed 2.0
BS          set speed 1.0

# Playlist
<           playlist-prev
>           playlist-next
PREV        playlist-prev
NEXT        playlist-next

# Volume & Audio
UP          add volume 5
DOWN        add volume -5
m           cycle mute
MUTE        cycle mute

# Subtitles
v           cycle sub-visibility
z           add sub-delay -0.1
Z           add sub-delay +0.1
Shift+g     add sub-scale +0.1
Shift+f     add sub-scale -0.1

# Video & Picture Adjustments
f           cycle fullscreen
ESC         script-binding classicplayer/escape
s           async screenshot video
S           async screenshot subtitles
1           add contrast -1
2           add contrast 1
3           add brightness -1
4           add brightness 1
5           add gamma -1
6           add gamma 1
7           add saturation -1
8           add saturation 1

# Window and Dialogs
Ctrl+o      script-binding classicplayer/open
Ctrl+u      script-binding classicplayer/open-url
Ctrl+l      script-binding classicplayer/load-subtitle
Ctrl+b      script-binding classicplayer/adjustments
Ctrl+t      script-binding classicplayer/next-theme
F1          script-binding classicplayer/help
q           quit

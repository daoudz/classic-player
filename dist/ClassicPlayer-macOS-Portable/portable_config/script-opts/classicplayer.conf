# ---------------------------------------------------------------------------
# Classic Player - User Configuration
# ---------------------------------------------------------------------------

# Active theme at initial launch:
# Options: win98 (Windows 95/98), win31 (Windows 3.1), platinum (Mac OS 8/9), system7 (Mac System 7)
theme=win98

# Draw retro window title bar and classic 3D border:
# yes = custom classic title bar and frame
# no  = native OS window title bar and border
classic_frame=yes

# UI scaling factor:
# 0 = automatic (adapts to display DPI / high-DPI monitors)
# 1 = standard 100% pixel scale (pixel-sharp retro feel)
# 2 = 200% scale (larger retro controls)
# 3 = 300% scale
ui_scale=0

# Seconds to jump when clicking Rewind / Fast Forward buttons or pressing Left/Right:
seek_step=10

# Remember user preferences across sessions (theme, scale, volume, frame style):
remember=yes

# Seconds before fullscreen controls auto-hide when mouse is inactive:
fs_hide_delay=2.5

# Custom font overrides (optional):
# If blank, the player automatically uses clean installed system fonts.
# Drop any retro TTF/OTF fonts in portable_config/fonts and specify the family name here.
font_win31=
font_win98=
font_platinum=
font_system7=
